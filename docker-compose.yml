services:
  signer:
    build: .
    image: signer:local
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "587:587"
      # Exchange Online outbound connectors smart-host on TCP 25 with STARTTLS.
      # Do not publish 25 to the internet. If you use M365, map 25 and allow
      # only the Azure Office365 service tag / Exchange Online IP ranges:
      # - "25:25"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/signer.db
      DATA_DIR: /data
      HTTP_PORT: "3000"
    volumes:
      - signer-data:/data
    # Azure/GCP: attach a static public IP and restrict NSG/firewall to
    # Microsoft 365 / Google mail connector IP ranges.

volumes:
  signer-data:
