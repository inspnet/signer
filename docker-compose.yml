services:
  signer:
    build: .
    image: signer:local
    restart: unless-stopped
    ports:
      # Loopback only: the portal is reached through Caddy (deploy/Caddyfile).
      - "127.0.0.1:3000:3000"
      - "2525:2525"
      - "587:587"
      # Uncomment if the host can bind 25 (often requires root / CAP_NET_BIND_SERVICE):
      # - "25:25"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/signer.db
      DATA_DIR: /data
      HTTP_PORT: "3000"
      HTTP_HOST: "0.0.0.0"
      # Caddy on the host reaches the container from Docker's bridge network.
      TRUST_PROXY: "loopback,uniquelocal"
    volumes:
      - signer-data:/data
    # Limit who may relay with SMTP_ALLOWED_CIDRS in .env and the host firewall.
    # The production deployment is Linode + Forge without Docker: see README.

volumes:
  signer-data:
