# Signer — Nginx for a Forge site.
#
# In Forge: Site → Edit Nginx configuration. Replace the existing
# `location / { ... }` block with the two blocks below, and delete the
# `location ~ \.php$ { ... }` block. Leave everything else Forge generated
# (listen, server_name, ssl_*, the forge-conf includes) as it is.
#
# `try_files` serves a file from the site's web directory if one exists and
# hands everything else to Signer. That keeps Let's Encrypt renewals working
# whichever way Forge serves its challenge files.

    location / {
        try_files $uri @signer;
    }

    location @signer {
        # Signer logs requests itself (journal, 14 days); a second copy here
        # would keep client IPs on a separate schedule. See PRIVACY.md.
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append, so a client cannot supply its own
        # address. Signer trusts this header only from loopback (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Signature artwork uploads are capped at 8 MB by the app.
        client_max_body_size 10m;
    }
