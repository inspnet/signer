name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm test
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p web/tsconfig.json --noEmit
